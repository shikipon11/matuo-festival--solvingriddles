<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1> 🔒 </h1>

    <p>集めた8文字のパスワードを入力してください</p>

    <input
        type="text"
        id="password"
        maxlength="8"
        placeholder="8文字を入力"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false">

    <button onclick="checkPassword()">
        ロック解除
    </button>

    <p id="message"></p>

    <button id="nextButton" onclick="goNext()">
    次に進む
    </button>
</div>

<script src="script.js"></script>

</body>
</html>
